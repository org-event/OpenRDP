name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the tag matches Cargo.toml
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }
      - name: Test
        run: cargo test --locked
      - name: Build
        run: cargo build --release --locked
      - name: Package
        run: |
          name="openrdp-$GITHUB_REF_NAME-aarch64-apple-darwin"
          mkdir "$name"
          cp target/release/openrdp scripts/openrdp-doctor README.md README.ru.md CHANGELOG.md LICENSE-MIT LICENSE-APACHE "$name/"
          tar -czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          scripts/make-dmg.sh target/release/openrdp "${GITHUB_REF_NAME#v}" "$name.dmg"
          shasum -a 256 "$name.dmg" > "$name.dmg.sha256"
          echo "ASSET=$name" >> "$GITHUB_ENV"
      - name: Client build tools
        run: brew install cmake ninja nasm pkgconf
      # Restore only: CI on main fills this cache, and a tag run need not write to it.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            client/build/deps/prefix-arm64
            client/build/deps/prefix-x86_64
            client/build/deps/stamps
          key: client-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('client/build-freerdp.sh') }}
      - name: Client
        run: |
          client/build-freerdp.sh
          VERSION="${GITHUB_REF_NAME#v}" client/build.sh --dmg
          client/check-app.sh --bundled
          name="openrdp-client-$GITHUB_REF_NAME-universal"
          mv "client/build/OpenRDP-Client-${GITHUB_REF_NAME#v}.dmg" "$name.dmg"
          shasum -a 256 "$name.dmg" > "$name.dmg.sha256"
          echo "CLIENT_ASSET=$name" >> "$GITHUB_ENV"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          Apple Silicon build. Open the disk image and drag OpenRDP to Applications.
          The window shows the command that takes the app out of quarantine; until then it will not open.
          The first launch asks for the RDP name and password, then for an administrator password, so a restart still reaches the login window.
          A running server asks before installing a newer release.

          OpenRDP Client (openrdp-client-…-universal.dmg) connects to OpenRDP servers from Apple Silicon and Intel Macs, with FreeRDP inside.
          Drag it to Applications, then run `xattr -dr com.apple.quarantine "/Applications/OpenRDP Client.app"`, since it is not notarized either.

          See CHANGELOG.md for the changes.
          EOF
          gh release create "$GITHUB_REF_NAME" \
            "$ASSET.dmg" "$ASSET.dmg.sha256" \
            "$CLIENT_ASSET.dmg" "$CLIENT_ASSET.dmg.sha256" \
            "$ASSET.tar.gz" "$ASSET.tar.gz.sha256" \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
