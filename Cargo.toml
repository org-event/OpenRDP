[package]
name = "openrdp"
version = "1.6.3"
edition = "2024"
description = "OpenRDP: an RDP server for macOS on Apple Silicon: ScreenCaptureKit, VideoToolbox H.264, EGFX"
license = "MIT OR Apache-2.0"
repository = "https://github.com/org-event/OpenRDP"
readme = "README.md"
keywords = ["rdp", "macos", "remote-desktop", "ironrdp", "screencapturekit"]
categories = ["network-programming", "multimedia::video"]
# Depends on IronRDP by git revision, which crates.io does not accept.
publish = false

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
block2 = "0.6.2"
bytes = "1.10.1"
dav-server = { version = "0.11.0", default-features = false }
dispatch2 = "0.3.1"
futures-util = { version = "0.3.31", default-features = false, features = ["alloc"] }
hyper = { version = "1.7.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.17", features = ["tokio"] }
ironrdp-cliprdr = { git = "https://github.com/org-event/IronRDP.git", rev = "58492e53ea815a222e4955d03331ca8c1c0bef53", version = "0.9.0" }
ironrdp-cliprdr-format = { git = "https://github.com/org-event/IronRDP.git", rev = "58492e53ea815a222e4955d03331ca8c1c0bef53", version = "0.3.0" }
ironrdp-displaycontrol = { git = "https://github.com/org-event/IronRDP.git", rev = "58492e53ea815a222e4955d03331ca8c1c0bef53", version = "0.10.0" }
ironrdp-dvc = { git = "https://github.com/org-event/IronRDP.git", rev = "58492e53ea815a222e4955d03331ca8c1c0bef53", version = "0.10.0" }
ironrdp-egfx = { git = "https://github.com/org-event/IronRDP.git", rev = "58492e53ea815a222e4955d03331ca8c1c0bef53", version = "0.5.0" }
ironrdp-pdu = { git = "https://github.com/org-event/IronRDP.git", rev = "58492e53ea815a222e4955d03331ca8c1c0bef53", version = "0.11.0" }
# default includes qoiz, which links zstd-safe decompression. The server encodes
# with VideoToolbox and never decompresses zstd, so that code stays out.
ironrdp-rdpdr = { git = "https://github.com/org-event/IronRDP.git", rev = "58492e53ea815a222e4955d03331ca8c1c0bef53", version = "0.9.0" }
ironrdp-rdpsnd = { git = "https://github.com/org-event/IronRDP.git", rev = "58492e53ea815a222e4955d03331ca8c1c0bef53", version = "0.11.0" }
ironrdp-server = { git = "https://github.com/org-event/IronRDP.git", rev = "58492e53ea815a222e4955d03331ca8c1c0bef53", version = "0.14.0", default-features = false, features = ["egfx", "helper", "rayon"] }
ironrdp-svc = { git = "https://github.com/org-event/IronRDP.git", rev = "58492e53ea815a222e4955d03331ca8c1c0bef53", version = "0.10.0" }
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSPasteboard", "NSPasteboardItem", "NSImageRep", "NSBitmapImageRep"] }
objc2-core-foundation = "0.3.2"
objc2-core-graphics = "0.3.2"
objc2-core-media = "0.3.2"
objc2-core-video = "0.3.2"
objc2-foundation = "0.3.2"
objc2-screen-capture-kit = "0.3.2"
objc2-video-toolbox = "0.3.2"
pico-args = "0.5.0"
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }
tokio = { version = "1.54.1", features = ["rt", "macros", "sync", "time", "net"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
