# cargo-deny: https://embarkstudios.github.io/cargo-deny/
# Run with `cargo deny check`.

[graph]
targets = ["aarch64-apple-darwin"]
all-features = true

[advisories]
version = 2
yanked = "deny"
# No release of the rsa crate fixes this one, and it is not a reachable hole
# in this server.
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "rsa via picky/sspi: Marvin timing attack, unfixed in every rsa release. NTLM does not use RSA, and TLS private-key operations go through rustls/aws-lc, not this crate" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "OpenSSL",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# IronRDP comes from the org-event fork: current upstream plus several accounts,
# the advanced-input hook and no rustls-pemfile, until upstream takes them.
allow-git = ["https://github.com/org-event/IronRDP.git"]
